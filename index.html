<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ponytail 비교</title>
<script>
  // 이 부분의 값만 두 폴더의 report.md 값으로 바꾼다.
  const DATA = {
    page: "1인 향초 공방 원데이 클래스 소개 페이지",
    costBasis: "API 가격, 1달러=1,333.74원 기준",
    costSource: "Claude Opus 5.5 공식 API 가격으로 환산",
    without: {
      file: "no-ponytail/index.html",
      lines: 467,
      tokens: { input: 28, cacheWrite: 46351, cacheRead: 656077, output: 13600 },
      usd: 0.7741,
      krw: 1032
    },
    with: {
      file: "with-ponytail/index.html",
      lines: 82,
      tokens: { input: 18, cacheWrite: 32275, cacheRead: 342300, output: 4983 },
      usd: 0.4264,
      krw: 569
    }
  };
</script>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #15181d;
    --line: #262a31;
    --text: #e8eaed;
    --muted: #8b929c;
    --red: #e5484d;
    --red-deep: #7f1d1d;
    --green: #30a46c;
    --green-text: #4cc38a;
    --green-deep: #14532d;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    display: grid;
    grid-template-rows: auto auto 1fr;
    gap: 12px;
    padding: 14px 16px 16px;
  }
  header h1 { font-size: 18px; font-weight: 700; }

  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto 1fr;
    column-gap: 12px;
  }
  .card h2 { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .card h2 small { font-size: 13px; font-weight: 600; color: var(--muted); }
  .card .desc { grid-column: 1; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .card .desc b { color: var(--green-text); font-weight: 700; }
  .card .ratio {
    grid-column: 2; grid-row: 1 / 3;
    font-size: 40px; font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
    align-self: center;
  }
  .bars { grid-column: 1 / -1; display: grid; gap: 7px; margin-top: 12px; align-content: end; }
  .bar { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 8px; font-size: 12px; }
  .bar .who { color: var(--muted); font-weight: 600; }
  .bar .track { height: 22px; background: #1e2228; border-radius: 6px; overflow: hidden; }
  .bar .fill {
    height: 100%; border-radius: 6px;
    display: flex; align-items: center; padding: 0 8px;
    font-size: 12px; font-weight: 700; color: #fff; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .bar.no .fill { background: var(--red); }
  .bar.yes .fill { background: var(--green); }
  .bar .track .fill.empty { background: transparent; color: var(--muted); }

  .previews { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 0; }
  .pane {
    display: grid; grid-template-rows: auto 1fr;
    border-radius: 12px; overflow: hidden;
    border: 2px solid; min-height: 0;
    position: relative;
  }
  .pane.no { border-color: var(--red); }
  .pane.yes { border-color: var(--green); }
  .pane-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; color: #fff; }
  .pane.no .pane-head { background: var(--red-deep); }
  .pane.yes .pane-head { background: var(--green-deep); }
  .pane-head strong { font-size: 15px; }
  .pane-head .meta { font-size: 12px; opacity: 0.85; }
  .pane iframe { width: 100%; height: 100%; border: 0; background: #fff; }

  details { margin-left: auto; font-size: 12px; }
  summary {
    cursor: pointer; list-style: none;
    padding: 4px 10px; border-radius: 6px;
    background: rgba(255,255,255,0.12); font-weight: 600;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: " ▾"; }
  details[open] summary::after { content: " ▴"; }
  details .pop {
    position: absolute; right: 10px; top: 44px; z-index: 2;
    background: #101317; border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  details table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  details th, details td { padding: 6px 12px; text-align: right; }
  details th:first-child, details td:first-child { text-align: left; }
  details thead th { color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); }
  details tfoot td { font-weight: 800; border-top: 1px solid var(--line); }
</style>
</head>
<body>

<header><h1 id="title"></h1></header>
<section class="cards" id="cards"></section>
<section class="previews" id="previews"></section>

<script>
  // 값이 비어 있으면 — 로 표시한다.
  const ok = v => typeof v === "number";
  const n = v => ok(v) ? v.toLocaleString("ko-KR") : "—";
  const total = t => [t.input, t.cacheWrite, t.cacheRead, t.output].every(ok) ? t.input + t.cacheWrite + t.cacheRead + t.output : null;
  const ready = (a, b) => ok(a) && ok(b) && a > 0;
  const ratio = (a, b) => ready(a, b) ? (a / b).toFixed(1) + "×" : "—×";
  const saved = (a, b) => ready(a, b) ? Math.round((1 - b / a) * 100) + "% 절약" : "—% 절약";
  const width = (a, b) => ready(a, b) ? (b / a * 100).toFixed(1) + "%" : "100%";
  const widthA = (a, b) => "100%";
  const W = DATA.without, P = DATA.with;

  document.getElementById("title").textContent = DATA.page + " — Ponytail 없이 vs Ponytail로";

  const cards = [
    { title: "코드 줄 수", desc: "index.html 전체 줄 수", a: W.lines, b: P.lines,
      la: n(W.lines) + "줄", lb: n(P.lines) + "줄" },
    { title: "전체 토큰", desc: "입력·캐시 생성·캐시 읽기·출력 합계", a: total(W.tokens), b: total(P.tokens),
      la: n(total(W.tokens)), lb: n(total(P.tokens)) },
    { title: "비용 <small>(" + DATA.costBasis + ")</small>", desc: DATA.costSource, a: W.usd, b: P.usd,
      la: "약 " + n(W.krw) + "원 · $" + (ok(W.usd) ? W.usd : "—"), lb: "약 " + n(P.krw) + "원 · $" + (ok(P.usd) ? P.usd : "—") }
  ];
  document.getElementById("cards").innerHTML = cards.map(c => `
    <article class="card">
      <h2>${c.title}</h2>
      <p class="desc">${c.desc} · <b>${saved(c.a, c.b)}</b></p>
      <div class="ratio">${ratio(c.a, c.b)}</div>
      <div class="bars">
        <div class="bar no"><span class="who">없이</span><div class="track"><div class="fill${ready(c.a, c.b) ? "" : " empty"}" style="width:${widthA(c.a, c.b)}">${c.la}</div></div></div>
        <div class="bar yes"><span class="who">Ponytail</span><div class="track"><div class="fill${ready(c.a, c.b) ? "" : " empty"}" style="width:${width(c.a, c.b)}">${c.lb}</div></div></div>
      </div>
    </article>`).join("");

  const pane = (cls, label, d) => `
    <div class="pane ${cls}">
      <div class="pane-head">
        <strong>${label}</strong>
        <span class="meta">${d.file}</span>
        <details>
          <summary>토큰 내역</summary>
          <div class="pop"><table>
            <thead><tr><th>항목</th><th>토큰</th></tr></thead>
            <tbody>
              <tr><td>입력</td><td>${n(d.tokens.input)}</td></tr>
              <tr><td>캐시 생성</td><td>${n(d.tokens.cacheWrite)}</td></tr>
              <tr><td>캐시 읽기</td><td>${n(d.tokens.cacheRead)}</td></tr>
              <tr><td>출력</td><td>${n(d.tokens.output)}</td></tr>
            </tbody>
            <tfoot><tr><td>전체</td><td>${n(total(d.tokens))}</td></tr></tfoot>
          </table></div>
        </details>
      </div>
      <iframe src="${d.file}" title="${label} 만든 페이지"></iframe>
    </div>`;
  document.getElementById("previews").innerHTML = pane("no", "Ponytail 없이", W) + pane("yes", "Ponytail로", P);
</script>
</body>
</html>
